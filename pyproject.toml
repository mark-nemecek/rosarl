[project]
name = "rosarl"
description = "ROSARL project"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
authors = [
    { name = "Mark Nemecek", email = "mark.nemecek@duke.edu" }
]
dependencies = [
    "omnisafe>=0.5.0",
    "torch>=2.4.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.4.1",
]
cu126 = [
    "torch>=2.4.1",
]
cu128 = [
    "torch>=2.4.1",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu128" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
